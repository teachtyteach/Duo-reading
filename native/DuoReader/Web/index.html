/* Layout: Apple-style library (large title, segmented filter, cover grid) and a full-screen book that is one page folded, a two-page spread open. */
:root{
  --paper:#ffffff; --ink:#1d1d1f; --muted:#86868b; --accent:#007aff; --danger:#ff3b30; --green:#34c759;
  --cell:#ffffff; --segon:#ffffff;
  --surface:color-mix(in srgb,var(--ink) 5%,var(--paper));
  --surface2:color-mix(in srgb,var(--ink) 9%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 14%,transparent);
  --glass:color-mix(in srgb,var(--paper) 90%,transparent);
  --fold:color-mix(in srgb,var(--ink) 5%,transparent);
  --fold2:color-mix(in srgb,var(--ink) 13%,transparent);
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Helvetica Neue',Arial,sans-serif;
  --titlefont:ui-serif,'New York','Iowan Old Style',Georgia,serif;
  --rfont:ui-serif,'New York','Iowan Old Style',Georgia,serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{--paper:#121214;--ink:#ececf1;--muted:#8e8e93;--accent:#0a84ff;--cell:#1f1f23;--segon:#3a3a3f;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--paper)}
@media (display-mode: standalone){#reader{bottom:auto;height:100lvh;min-height:100%}body{min-height:100lvh}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .3s}
body.reading{overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Library (cinematic) ---------- */
html,body{background:#0b0b0f}
.cine{--paper:#0b0b0f;--ink:#f5f5f7;--muted:#9b9ba6;--accent:#f0b65a;--surface:#141419;--surface2:#26262e;--cell:#1c1c22;--segon:#40404a;
  --line:rgba(255,255,255,.09);--glass:rgba(22,22,28,.62);--danger:#ff6961;--green:#5fd38d;color-scheme:dark;color:var(--ink)}
#library{min-height:100%;background:var(--paper);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px);overflow-x:hidden;position:relative}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.libbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;transition:background .3s,box-shadow .3s}
.libbar.solid{background:rgba(11,11,15,.74);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 .5px 0 rgba(255,255,255,.08)}
.wordmark{font-family:var(--titlefont);font-size:22px;font-weight:600;letter-spacing:-.01em;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.wordmark i{color:var(--accent);font-style:italic;font-weight:500}
.tools{display:flex;gap:10px;align-items:center}
.round{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;position:relative;flex:none;
  background:rgba(30,30,38,.55);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
.round input{display:none}
.ringbtn svg{width:40px;height:40px}
#libHero{position:relative;margin-top:calc(-1 * (env(safe-area-inset-top,0px) + 60px));overflow:hidden;isolation:isolate}
.hero-back{position:absolute;inset:-25%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.7) brightness(.85);z-index:-2;transform:translateZ(0)}
.hero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,11,15,.25) 0%,rgba(11,11,15,.2) 35%,rgba(11,11,15,.75) 75%,#0b0b0f 100%)}
.hero-c{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:calc(env(safe-area-inset-top,0px) + 84px);padding-bottom:26px}
.hero-c .cv{width:min(48vw,200px);border-radius:4px 7px 7px 4px;box-shadow:0 2px 4px rgba(0,0,0,.35),0 34px 60px -18px rgba(0,0,0,.85),0 0 90px -10px var(--glow,rgba(255,255,255,.15))}
.hero-t{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;max-width:560px}
.kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero-t h1{font-family:var(--titlefont);font-weight:600;font-size:clamp(30px,8vw,46px);line-height:1.04;letter-spacing:-.015em;margin:0;color:#fff;text-wrap:balance}
.hero-t .by{font-size:16px;color:rgba(255,255,255,.72)}
.hero-t .info{font-size:14px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums;margin-top:2px}
.hero-t .pbar{width:min(260px,70vw);height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:4px}
.hero-t .pbar i{display:block;height:100%;background:#fff;border-radius:2px}
.cta{display:flex;gap:12px;align-items:center;margin-top:12px}
.play{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:14px;background:#fff;color:#0b0b0f;font-weight:700;font-size:17px;padding:13px 26px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(255,255,255,.35)}
.play svg{width:16px;height:16px;fill:currentColor}
.play:active,.round:active{transform:scale(.96)}
.ghost-btn{width:48px;height:48px;border-radius:14px}
@media (min-width:720px){
  .hero-c{flex-direction:row;text-align:left;align-items:flex-end;gap:36px;padding-bottom:40px}
  .hero-c .cv{width:210px}
  .hero-t{align-items:flex-start}
}
.rowsec{margin-top:30px}
.rowsec h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px;font-size:21px;font-weight:700;letter-spacing:-.015em}
.rowsec h2 small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-top:4px;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail::after{content:"";flex:0 0 4px}
.rail .card{flex:none;width:clamp(112px,31vw,152px);scroll-snap-align:start;scroll-margin-left:max(20px,env(safe-area-inset-left,0px))}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:26px 16px}
.card{min-width:0}
.open-b{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer}
.cv{container-type:inline-size;aspect-ratio:2/3;max-width:100%;border-radius:3px 6px 6px 3px;overflow:hidden;position:relative;background:#1c1c22;
  box-shadow:0 1px 2px rgba(0,0,0,.4),0 14px 26px -12px rgba(0,0,0,.75);transition:transform .3s cubic-bezier(.22,1.2,.36,1)}
.open-b:active .cv{transform:scale(.95)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25) 0,rgba(255,255,255,.12) 2.5%,rgba(0,0,0,.05) 5%,transparent 9%),linear-gradient(180deg,rgba(255,255,255,.06),transparent 40%);pointer-events:none}
.gen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:16% 12% 13% 15%;color:#f6f2ea;position:relative}
.gen::before{content:"";position:absolute;inset:6% 7% 6% 10%;border:1px solid rgba(246,242,234,.28);border-radius:2px}
.gen b{font-family:var(--titlefont);font-weight:600;font-size:clamp(10px,13cqw,22px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere;position:relative}
.gen span{font-size:clamp(7px,7.5cqw,11px);letter-spacing:.1em;text-transform:uppercase;opacity:.82;position:relative}
.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;margin-top:10px}
.meta .tx{min-width:0;flex:1}
.meta .t{font-weight:600;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .a{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{flex:none;width:28px;height:28px;margin:-4px -6px 0 0;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center;cursor:pointer}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.done-chip{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2}
.done-chip svg{width:14px;height:14px;stroke:#0b0b0f;stroke-width:3;fill:none}
.empty{color:var(--muted);padding:10px 0}
.hint{margin-top:40px;color:var(--muted);font-size:13px;line-height:1.5;max-width:62ch}
.drop{outline:2px dashed var(--accent);outline-offset:-8px}
.goalchip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 12px 7px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;color:rgba(255,255,255,.8);border:0;cursor:pointer}
.goalchip svg{width:22px;height:22px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 6px;font-size:13px;font-weight:500;min-height:32px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:600}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);border-radius:5px;padding:2px 6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- Reader ---------- */
#reader{position:fixed;inset:0;background:var(--paper);color:var(--ink);z-index:5;overflow:hidden;
  --fs:19px;--lh:1.5;--margin:28px;--gap:56px;--colh:600px;
  --sideL:calc(max(16px,env(safe-area-inset-left,0px)) + var(--margin) - 16px);
  --sideR:calc(max(16px,env(safe-area-inset-right,0px)) + var(--margin) - 16px);
  --topH:calc(env(safe-area-inset-top,0px) + 34px); --botH:calc(env(safe-area-inset-bottom,0px) + 30px)}
@media (max-height:520px){#reader{--topH:calc(env(safe-area-inset-top,0px) + 28px);--botH:calc(env(safe-area-inset-bottom,0px) + 24px)}}
.rh,.rf{position:absolute;left:var(--sideL);right:var(--sideR);display:grid;grid-template-columns:1fr;column-gap:var(--gap);color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.rh{top:0;height:var(--topH);align-items:end;padding-bottom:7px}
.rf{bottom:0;height:var(--botH);align-items:start;padding-top:6px}
.rh span,.gh{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.rf span,.gf{font-size:12px;letter-spacing:.01em}
.rh span,.rf span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;min-width:0}
#headL,#folioL,#folioR{display:none}
.spread .rh,.spread .rf{grid-template-columns:1fr 1fr}
.spread #headL{display:block}
.spread #folioL{display:block;text-align:left}
.spread #folioR{display:block;text-align:right}
.spread #folioMid{display:none}
#area{position:absolute;top:var(--topH);bottom:var(--botH);left:var(--sideL);right:var(--sideR);overflow:hidden;touch-action:none}
#reader{touch-action:none;-webkit-touch-callout:none}
body.reading,html:has(body.reading){overscroll-behavior:none}
.flow .cont{text-indent:0!important}
.dropcaps .flow .cont::first-letter{float:none!important;font-size:inherit!important;line-height:inherit!important;padding:0!important;font-weight:inherit!important;color:inherit!important}
.justify .flow .cutend{text-align-last:justify}
.pfrag{position:absolute;left:0;top:0;column-count:auto!important}
#curl .view{position:absolute;inset:0;background:var(--paper);will-change:transform}
#curl .view.old{box-shadow:0 0 28px rgba(0,0,0,.14)}
#curl .face.clear{background:transparent}
#curl .vfold{position:absolute;background:linear-gradient(90deg,transparent 0,var(--fold) 36%,var(--fold2) 50%,var(--fold) 64%,transparent 100%)}
#curl .leaf{will-change:transform}
.flow{font-family:var(--rfont);font-size:var(--fs);line-height:var(--lh);column-fill:auto;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;font-kerning:normal;text-rendering:optimizeLegibility;-webkit-user-select:text;user-select:text}
.flow p{margin:0;text-indent:1.4em;orphans:2;widows:2;hanging-punctuation:allow-end}
.flow .orn{height:calc(var(--colh) * .16);display:flex;align-items:flex-end;justify-content:flex-start;padding-bottom:1.1em;break-after:avoid}
.flow .orn::after{content:"";width:2.2em;height:2px;border-radius:1px;background:var(--accent);opacity:.75}
.flow .opener{font-size:1.65em!important;line-height:1.15!important;font-weight:600;letter-spacing:-.012em;margin:0 0 1.15em!important;text-align:left}
.dropcaps .flow .opener+p{display:flow-root;text-indent:0}
.dropcaps .flow .opener+p::first-letter{float:left;font-size:3.15em;line-height:.86;padding:.07em .1em 0 0;font-weight:600;color:var(--ink);font-variant-caps:normal;letter-spacing:0}
.flow .opener+p{text-indent:0}
.flow .lead{font-variant-caps:all-small-caps;letter-spacing:.06em;font-size:1.06em}
.flow :is(h1,h2,h3,h4,h5,h6)+p,.flow p:first-child,.flow hr+p,.flow blockquote+p,.flow div+p{text-indent:0}
.dropcaps .flow :is(h1,h2)+p{display:flow-root}
.dropcaps .flow :is(h1,h2)+p::first-letter{float:left;font-size:3.15em;line-height:.86;padding:.07em .1em 0 0;font-weight:600;color:var(--ink);font-variant-caps:normal;letter-spacing:0}
.justify .flow p{text-align:justify}
.flow h1,.flow h2,.flow h3,.flow h4{font-weight:600;line-height:1.25;text-indent:0;margin:1.3em 0 .9em;break-after:avoid;text-wrap:balance}
.flow h1{font-size:1.5em;margin-top:2.4em;letter-spacing:-.005em}
.flow h2{font-size:1.25em}
.flow h3{font-size:1.08em}
.flow h1:first-child,.flow h2:first-child{margin-top:1.8em}
.flow img,.flow svg{display:block;max-width:100%;max-height:var(--colh);height:auto;width:auto;margin:.6em auto;object-fit:contain;break-inside:avoid}
.flow blockquote{margin:1em 1.2em;font-size:.95em}
.flow ul,.flow ol{padding-left:1.4em;margin:.6em 0}
.flow li{margin:.2em 0}
.flow hr{border:0;text-align:center;margin:1.2em 0;height:1.2em}
.flow hr::before{content:"⁂";color:var(--muted)}
.flow table{border-collapse:collapse;font-size:.9em;max-width:100%}
.flow td,.flow th{border:1px solid var(--line);padding:.2em .4em}
.flow pre{white-space:pre-wrap;font-size:.85em}
.flow a{color:inherit}
.flow .ilink{color:var(--accent);text-decoration:none;cursor:pointer}
.flow sup .ilink,.flow .ilink sup{font-weight:600}
.flow .end{text-align:center;text-indent:0;color:var(--muted);font-style:italic;margin-top:2em}
mark.hl{color:inherit;border-radius:3px;padding:0 1px;margin:0 -1px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.yellow{background:rgba(255,204,0,.4)} .hl.green{background:rgba(52,199,89,.32)} .hl.blue{background:rgba(10,132,255,.28)} .hl.pink{background:rgba(255,55,95,.26)}
.hl.purple{background:none;text-decoration:underline;text-decoration-color:rgba(175,82,222,.95);text-decoration-thickness:2px;text-underline-offset:3px}
.hl.has-note::after{content:"";display:inline-block;width:.36em;height:.36em;border-radius:50%;background:var(--accent);vertical-align:.7em;margin-left:2px}
mark.found{color:inherit;border-radius:3px;background:rgba(255,159,10,.55);animation:found 3s ease forwards}
@keyframes found{0%,60%{background:rgba(255,159,10,.55)}100%{background:transparent}}
#fold{position:absolute;top:0;bottom:0;left:50%;width:var(--gap);transform:translateX(-50%);pointer-events:none;display:none;
  background:linear-gradient(90deg,transparent 0,var(--fold) 36%,var(--fold2) 50%,var(--fold) 64%,transparent 100%)}
.spread #fold{display:none}
#spine{position:absolute;top:0;bottom:0;left:calc(var(--spineX,50%) - var(--gap)/2);width:var(--gap);pointer-events:none;display:none;z-index:2;
  background:linear-gradient(90deg,transparent 0,var(--fold) 36%,var(--fold2) 50%,var(--fold) 64%,transparent 100%)}
.spread #spine{display:block}
#fold{z-index:1}
#spreadLayer{position:absolute;inset:0;z-index:0;background:var(--paper);display:flex;align-items:center;justify-content:center}
#spreadLayer img{width:100%;height:100%;object-fit:contain;display:block}
.spreadph{break-inside:avoid;-webkit-column-break-inside:avoid;break-before:column;-webkit-column-break-before:always;margin:0}
#curl .spimg{position:absolute;top:0;object-fit:contain;background:var(--paper)}
#ink{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .12s}
#reader.penmode #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
#reader.penmode .flow{-webkit-user-select:none;user-select:none}
#penBtn.on{background:var(--surface2)}
#penBar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:2px;padding:6px;border-radius:20px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:.5px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:calc(100% - 20px);overflow-x:auto}
#penBar .tool{width:42px;height:42px;border-radius:13px;border:0;background:none;display:grid;place-items:center;color:var(--ink);cursor:pointer;flex:none}
#penBar .tool.on{background:var(--surface2);color:var(--accent)}
#penBar .pc{width:26px;height:26px;border-radius:50%;border:0;margin:0 5px;cursor:pointer;flex:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
#penBar .pc.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}

  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);transform:translateY(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 4px rgba(0,0,0,.2)}

/* page curl layer */
#curl{position:absolute;inset:0;z-index:2;pointer-events:none;perspective:2200px;perspective-origin:50% 50%}
#curl .face{position:absolute;top:0;height:100%;overflow:hidden;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden}
#curl .slice{position:absolute;overflow:hidden}
#curl .slice>.flow{position:absolute;left:0;top:0}
#curl .ghost{position:absolute;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;display:block}
#curl .leaf{position:absolute;top:0;height:100%;transform-style:preserve-3d}
#curl .leaf .face{left:0;width:100%}
#curl .leaf .back{transform:rotateY(180deg)}
#curl .inkface{position:absolute;pointer-events:none}
#curl .shade{position:absolute;inset:0;opacity:0;pointer-events:none}
#curl .front .shade{background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.04) 40%,rgba(0,0,0,.12))}
#curl .back .shade{background:linear-gradient(270deg,rgba(0,0,0,.25),rgba(0,0,0,.05) 35%,transparent)}
#curl .cast{position:absolute;top:0;height:100%;opacity:0;pointer-events:none}

/* chrome */
.chrome-bar{position:absolute;left:0;right:0;z-index:3;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
#bar{top:0;padding-top:max(env(safe-area-inset-top,0px),18px);display:flex;align-items:center;gap:2px;height:calc(max(env(safe-area-inset-top,0px),18px) + 52px);border-bottom:.5px solid var(--line)}
#bar .ttl{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}

#bar2 .row2 span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:500}
#scrub{width:100%;max-width:720px;display:block;margin:10px auto 0;accent-color:var(--accent)}
#bar,#bar2{transition:transform .45s cubic-bezier(.22,1.15,.36,1),opacity .25s}
#reader:not(.chrome) #bar{transform:translateY(-100%);opacity:0;pointer-events:none;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s,visibility 0s .28s}
#reader:not(.chrome) #bar2{transform:translateY(100%);opacity:0;pointer-events:none;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s,visibility 0s .28s}
.rh{transition:opacity .2s}
#reader.chrome .rh{opacity:0}
@media (max-width:560px){#bar .ttl{font-size:0}}
#bar{gap:0}
#scrub{-webkit-appearance:none;appearance:none;height:28px;background:transparent}
#scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--surface2) var(--p,0%))}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.08)}
#scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--surface2)}
#scrub::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
#scrub::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ib{width:44px;height:44px;border:0;background:none;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--accent)}
.ib:active{background:var(--surface2)}
.ib .aa{font-family:var(--titlefont);font-size:19px;font-weight:600;letter-spacing:-.02em}
#bmBtn.on svg{fill:currentColor}

/* ---- reader controls: dark glass, player style ---- */
.glass{background:rgba(22,22,28,.6);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
  box-shadow:0 14px 34px -12px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.08)}

  bottom:max(env(safe-area-inset-bottom,0px),12px);border-radius:22px;padding:13px 18px 9px!important;border-top:0!important;color:#fff}

#scrub{margin-top:6px!important}

#scrub::-webkit-slider-thumb{width:16px!important;height:16px!important;margin-top:-6px!important;box-shadow:0 2px 8px rgba(0,0,0,.5)!important}
#penBar{background:rgba(22,22,28,.66)!important;color:#fff}

/* ---- designed covers ---- */
.gen{--g:#d9b46a;--fg:#f6f1e6}

/* sheets */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(540px,100%);max-height:88%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);
  border-radius:14px 14px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.22);transform:translate(-50%,105%);visibility:hidden;
  transition:transform .26s cubic-bezier(.4,0,.8,.4),visibility 0s .26s}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .5s cubic-bezier(.22,1.22,.36,1)}

}

#welcome{position:fixed;inset:0;z-index:85;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 30px) max(28px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(28px,env(safe-area-inset-left,0px));animation:fadein .4s ease}

  const norm=t=>t.toLowerCase().replace(/\d+/g,'#').replace(/\s+/g,' ');
  const cnt={};
  pages.forEach(l=>{const e=[...l.slice(0,2),...l.slice(-2)];new Set(e.map(x=>norm(x.t))).forEach(k=>cnt[k]=(cnt[k]||0)+1)});
  const lim=Math.max(3,Math.ceil(pages.length*.4));
  const bare=t=>/^(page\s+)?(\d{1,4}|[ivxlc]{1,6})(\s*(of|\/)\s*\d{1,4})?$/i.test(t.trim());

  for(const x of out){
    if(x.brk){prev=prev&&{...prev,pageEnd:true};continue}
    if(prev===null)text+=x.t;
    else{
      const gap=prev.y-x.y,para=!prev.pageEnd&&(gap>prev.h*1.7||Math.abs(x.h-prev.h)>Math.max(x.h,prev.h)*.15);
      if(para)text+='\n\n'+x.t;
      else if(/[a-z]-$/.test(text)&&/^[a-z]/.test(x.t))text=text.slice(0,-1)+x.t;
      else if(prev.pageEnd&&(/[.!?"”’)]$/.test(text)||Math.abs(x.h-prev.h)>Math.max(x.h,prev.h)*.15||/^(chapter|part|book|prologue|epilogue)\b/i.test(x.t)))text+='\n\n'+x.t;
      else text+=' '+x.t;
    }
    prev=x;
  }
  let title='',author='';
  try{const md=await pdf.getMetadata();const i=md&&md.info||{};
    if(i.Title&&i.Title.trim().length>2&&!/\.(docx?|pdf|indd|pages|rtf)\b|^untitled|^microsoft/i.test(i.Title))title=i.Title.trim();
    if(i.Author&&i.Author.trim().length>1&&!/^(admin|user|owner)/i.test(i.Author))author=i.Author.trim()}catch(_){}
  let cover=null;
  try{
    const pg=await pdf.getPage(1),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(2,640/v0.width)});
    const c=document.createElement('canvas');c.width=vp.width|0;c.height=vp.height|0;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);

    const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.84));if(bl)cover={type:'image/jpeg',buf:await bl.arrayBuffer()};
  }catch(_){}
  try{pdf.destroy()}catch(_){}
  return{text,title,author,cover};
}

function freeParas(t,title){
  const ps=t.replace(/\r/g,'').split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean);
  const h=ps[0]&&ps[0].toLowerCase().replace(/[.:]$/,'');
  if(ps.length>1&&ps[0].length<90&&h&&title.toLowerCase().includes(h))ps.shift();
  return ps;
}

const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
async function makeBackup(){
  try{save()}catch(_){}saveStats();
  const ls={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^dr\./.test(k))ls[k]=localStorage.getItem(k)}
  const books=[];
  for(const r of await allBooks()){const o={id:r.id,kind:r.kind,src:r.src,title:r.title,author:r.author||'',added:r.added,data:b64(r.data)};if(r.cover)o.cover={type:r.cover.type,b64:b64(r.cover.buf)};books.push(o)}
  return JSON.stringify({app:'duo-reader',v:1,made:Date.now(),ls,books});
}
async function shareFile(name,text){
  if(NATIVE){native({type:'share',name,text});return}
  const file=new File([text],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
async function restoreBackup(file){
  let j=null;try{j=JSON.parse(await file.text())}catch(_){}
  if(!j||j.app!=='duo-reader'||!j.ls){toast('That file isn’t a Duo Reader backup.');return}
  toast('Restoring…');
  let n=0;
  for(const o of j.books||[]){if(!o.data)continue;const r={id:o.id,kind:o.kind,title:o.title,author:o.author||'',added:o.added||Date.now(),data:unb64(o.data)};if(o.src)r.src=o.src;if(o.cover)r.cover={type:o.cover.type,buf:unb64(o.cover.b64)};await putBook(r);n++}
  const MERGE=['dr.progress','dr.meta','dr.hl','dr.bm','dr.ink','dr.stats'];
  for(const [k,v] of Object.entries(j.ls)){
    if(k==='dr.welcomed')continue;
    if(MERGE.includes(k)){try{const cur=JSON.parse(localStorage.getItem(k)||'{}'),inc=JSON.parse(v);if(cur&&inc&&typeof cur==='object'&&typeof inc==='object'&&!Array.isArray(inc)){localStorage.setItem(k,JSON.stringify(Object.assign(cur,inc)));continue}}catch(_){}}
    localStorage.setItem(k,v);
  }
  haptic('success');toast(n===1?'Restored 1 book and your notes':`Restored ${n} books and your notes`);
  setTimeout(()=>location.reload(),1400);
}

let qT;$('#q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(runSearch,220)});
function runSearch(){
  const q=$('#q').value.trim(),out=$('#results');
  if(q.length<2){out.innerHTML='';return}
  const ql=q.toLowerCase(),b=S.book,res=[];
  for(let i=0;i<b.texts.length&&res.length<300;i++){
    const t=b.texts[i],tl=t.toLowerCase();let at=0,k;
    while((k=tl.indexOf(ql,at))>=0&&res.length<300){res.push({ch:i,off:k});at=k+ql.length}
  }
  if(!res.length){out.innerHTML=`<p class="muted" style="text-align:center;padding:24px 0">No results for “${esc(q)}”.</p>`;return}
  let html=`<p class="muted" style="margin:0 0 10px 4px;font-size:13px">${res.length>=300?'300+':res.length} result${res.length===1?'':'s'}</p>`,lastCh=-1;
  for(const r of res){
    if(r.ch!==lastCh){if(lastCh>=0)html+='</div>';html+=`<div class="glabel">${esc(b.chapters[r.ch].head||'')}</div><div class="group">`;lastCh=r.ch}
    const t=b.texts[r.ch],a=Math.max(0,r.off-50),z=Math.min(t.length,r.off+q.length+70);

const sm=$('#selMenu');
function hideSel(){sm.hidden=true}
function selInFlow(){const s=getSelection();if(!s||s.isCollapsed||!s.rangeCount)return null;const r=s.getRangeAt(0);if(!flow.contains(r.commonAncestorContainer))return null;if(!r.toString().trim())return null;return r}
let selT;
document.addEventListener('selectionchange',()=>{clearTimeout(selT);selT=setTimeout(()=>{
  const r=reader.hidden?null:selInFlow();
  if(!r){hideSel();return}
  const rects=[...r.getClientRects()].filter(x=>x.width);const last=rects[rects.length-1]||r.getBoundingClientRect(),first=rects[0]||last;
  sm.hidden=false;const mw=sm.offsetWidth,mh=sm.offsetHeight;
  let top=last.bottom+44;if(top+mh>innerHeight-10)top=first.top-mh-52;top=Math.max(10,Math.min(innerHeight-mh-10,top));
  let left=Math.max(10,Math.min(innerWidth-mw-10,(first.left+last.right)/2-mw/2));
  sm.style.top=top+'px';sm.style.left=left+'px';
},180)});
sm.addEventListener('pointerdown',e=>e.preventDefault());
sm.addEventListener('click',async e=>{
  const btn=e.target.closest('button');if(!btn)return;
  const r=selInFlow();if(!r)return hideSel();
  const text=r.toString().replace(/\s+/g,' ').trim();
  if(btn.dataset.color){addHighlight(r,btn.dataset.color);return}
  const act=btn.dataset.act;
  if(act==='note'){const h=addHighlight(r,'yellow');openHighlight(h.id,true);return}
  if(act==='define'){getSelection().removeAllRanges();hideSel();define(text);return}
  if(act==='copy'){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(_){toast('Couldn’t copy')}getSelection().removeAllRanges();hideSel();return}
  if(act==='search'){getSelection().removeAllRanges();hideSel();$('#q').value=text.slice(0,60);openSheet('#searchSheet');runSearch()}
});
function addHighlight(r,color){
  const start=offsetIn(r.startContainer,r.startOffset),end=offsetIn(r.endContainer,r.endOffset);
  const h={id:uid(),ch:S.ch,start,end,color,note:'',text:S.book.texts[S.ch].slice(start,end).replace(/\s+/g,' ').trim().slice(0,600),t:Date.now()};
  S.hl[S.rec.id].push(h);saveHL();haptic();getSelection().removeAllRanges();hideSel();
  const off=S.off;renderChapter(S.ch,{off});

}
function openHighlight(id,focusNote){

let DICT=null;
function loadDict(){return DICT||(DICT=fetch('dictionary.json').then(r=>{if(!r.ok)throw new Error('dict');return r.json()}).catch(e=>{DICT=null;throw e}))}
async function define(text){
  const word=text.replace(/^[^\p{L}]+|[^\p{L}'’-]+$/gu,'').trim();
  const links=`<div class="linkrow"><a class="pill" href="https://translate.google.com/?sl=auto&tl=es&op=translate&text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Translate to Spanish</a><a class="pill" href="https://www.google.com/search?q=${encodeURIComponent('define '+word)}" target="_blank" rel="noopener">Search the Web</a></div>`;
  $('#infoTitle').textContent='Dictionary';
  $('#infoBody').innerHTML=`<div class="def"><h3>${esc(word||text)}</h3><p class="muted">Looking it up…</p></div>`;
  openSheet('#infoSheet');
  if(!word||word.split(/\s+/).length>3){$('#infoBody').innerHTML=`<div class="def"><h3>${esc(text.slice(0,60))}</h3><p class="muted">Select a single word to see its definition.</p></div>${links}`;return}
  const key=word.toLowerCase().replace(/’/g,"'").replace(/'s$/,'');
  let offline=null;
  try{const D=await loadDict();
    const cands=[key,D.x[key]];
    for(const [re,to] of [[/ies$/,'y'],[/ves$/,'f'],[/es$/,''],[/s$/,''],[/ied$/,'y'],[/ed$/,''],[/ed$/,'e'],[/(.)\1ed$/,'$1'],[/ing$/,''],[/ing$/,'e'],[/(.)\1ing$/,'$1'],[/ly$/,''],[/ily$/,'y'],[/er$/,''],[/est$/,''],[/ier$/,'y'],[/iest$/,'y']])if(re.test(key))cands.push(key.replace(re,to));
    const w=cands.find(c=>c&&D.d[c]);if(w)offline={w,defs:D.d[w]}}catch(_){}
  if(offline){
    const by={};offline.defs.forEach(([p,d])=>(by[p]=by[p]||[]).push(d));
    const POS={n:'noun',v:'verb',adj:'adjective',adv:'adverb',prep:'preposition',art:'article',pron:'pronoun',conj:'conjunction',interj:'interjection'};
    $('#infoBody').innerHTML=`<div class="def"><h3>${esc(offline.w)}</h3>${offline.w!==key?`<div class="ph">from “${esc(word)}”</div>`:''}${Object.entries(by).slice(0,4).map(([p,ds])=>`<div class="pos">${esc(POS[p]||p)}</div><ol>${ds.slice(0,3).map(d=>`<li>${esc(d)}</li>`).join('')}</ol>`).join('')}<div class="src">Built-in dictionary · works offline</div></div>${links}`;
  }
  try{
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),offline?3500:9000);
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key),{signal:ctl.signal});clearTimeout(tm);
    if(offline&&!r.ok)return;
    if(r.status===404){$('#infoBody').innerHTML=`<div class="def"><h3>${esc(word)}</h3><p class="muted">No definition found.</p></div>${links}`;return}
    const data=await r.json();const e0=data[0];
    const ph=e0.phonetic||(e0.phonetics||[]).map(p=>p.text).find(Boolean)||'';
    const ms=data.flatMap(e=>e.meanings).slice(0,4);
    $('#infoBody').innerHTML=`<div class="def"><h3>${esc(e0.word)}</h3><div class="ph">${esc(ph)}</div>${ms.map(m=>`<div class="pos">${esc(m.partOfSpeech)}</div><ol>${m.definitions.slice(0,3).map(d=>`<li>${esc(d.definition)}${d.example?`<div class="ex">“${esc(d.example)}”</div>`:''}</li>`).join('')}</ol>`).join('')}</div>${links}`;
  }catch(_){
    if(offline)return;
    $('#infoBody').innerHTML=`<div class="def"><h3>${esc(word)}</h3><p class="muted">No definition found. Connect to the internet for a bigger dictionary.</p></div>${links}`;
  }
}

  catch(e){toast('That file couldn’t be opened.')}
};
window.duoOpenBook=id=>{const b=S.books.find(x=>x.id===id);if(!b){toast('That book isn’t in your library anymore.');return}if(S.rec&&S.rec.id===id)return;if(!reader.hidden)closeBook();openBook(b)};
window.duoContinue=()=>{if(!reader.hidden)return;const b=S.books.find(x=>x.id===S.last)||S.books.find(x=>prog(x.id).pct>0);if(b)openBook(b);else toast('Pick a book to start reading.')};
setInterval(sendState,60000);

/* ---------- read aloud ---------- */
const TTS={on:false,playing:false,ch:0,rate:LS.get('dr.ttsRate',1),utt:null,gen:0,at:0};
const RATES=[0.8,1,1.25,1.5,1.75];
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function renderTTS(){
  $('#ttsBar').hidden=!TTS.on;$('#ttsBtn').classList.toggle('on',TTS.on);
  if(!TTS.on)return;
  $('#ttsPP').innerHTML=TTS.playing?ICON_PAUSE:ICON_PLAY;$('#ttsPP').setAttribute('aria-label',TTS.playing?'Pause':'Play');
  $('#ttsRate').textContent=(TTS.rate%1?TTS.rate:TTS.rate.toFixed(0))+'×';
  $('#ttsLbl').innerHTML=`${TTS.playing?'Listening':'Paused'}<small>${esc(S.book?S.book.chapters[S.ch].head||'':'')}</small>`;
}
const BLOCK_RE=/^(P|H[1-6]|LI|BLOCKQUOTE|DD|DT|FIGCAPTION|TD|TH|PRE|DIV|SECTION|ARTICLE|ASIDE|FIGURE|TR|HEADER|FOOTER)$/;
// Split the chapter into paragraphs so the voice can breathe between them, like a person reading.
function ttsSegments(off){
  const segs=[];let cur=null;
  const blockOf=n=>{let e=n.parentElement;while(e&&e!==flow&&!BLOCK_RE.test(e.tagName))e=e.parentElement;return e};
  for(const {n,s:st0} of S.idx){
    if(st0+n.length<=off)continue;
    let t=n.data,st=st0;if(st<off){t=t.slice(off-st);st=off}
    const b=blockOf(n);
    if(cur&&cur.b===b&&cur.end===st){cur.t+=t;cur.end+=t.length}
    else{cur&&segs.push(cur);cur={b,s:st,t,end:st+t.length}}
  }
  cur&&segs.push(cur);
  return segs.filter(g=>/[\p{L}\p{N}]/u.test(g.t)).map(g=>[g.s,g.t,g.b&&/^H[1-6]$/.test(g.b.tagName)?1:0]);
}
function webVoice(){
  if(!('speechSynthesis' in window))return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>v.voiceURI===S.set.voice)||vs.find(v=>v.voiceURI===(sortVoices(webVoices())[0]||{}).id)||null;
}
function ttsSpeakFrom(off){
  if(!S.book)return;
  const segs=ttsSegments(off);const g=++TTS.gen;
  TTS.ch=S.ch;TTS.on=true;TTS.playing=true;TTS.at=off;
  if(NATIVE)native({type:'speak',segments:segs,rate:TTS.rate,voice:S.set.voice||'',title:S.book.title,author:S.book.author||''});
  else if('speechSynthesis' in window){
    speechSynthesis.cancel();let i=0;const v=webVoice();
    const next=()=>{
      if(TTS.gen!==g||!TTS.on)return;
      if(i>=segs.length){duoSpeech('done');return}
      const [st,t,h]=segs[i++];const u=new SpeechSynthesisUtterance(t);u.rate=TTS.rate;if(v){u.voice=v;u.lang=v.lang}
      u.onboundary=e=>{if(TTS.gen===g&&e.name!=='sentence')duoSpeech('range',st+e.charIndex,e.charLength||1)};
      u.onend=()=>{if(TTS.gen===g)setTimeout(next,h?520:240)};
      TTS.utt=u;speechSynthesis.speak(u);
    };
    next();
  }else{toast('Read aloud isn’t available here.');TTS.on=false}
  renderTTS();
}

/* ---------- voices ---------- */
let VOICES=[],VOICE_OPEN=false;
const Q_RANK={personal:4,premium:3,enhanced:2,default:1};
const REGION={US:'American',GB:'British',AU:'Australian',IE:'Irish',ZA:'South African',IN:'Indian',NZ:'New Zealand',CA:'Canadian',SG:'Singaporean'};
function webVoices(){
  if(!('speechSynthesis' in window))return[];
  return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!/eloquence|novelty|bad news|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|bahh/i.test(v.voiceURI+' '+v.name))
    .map(v=>({id:v.voiceURI,name:v.name.replace(/\s*\((premium|enhanced|improved)\)/i,''),lang:v.lang,q:/premium/i.test(v.name)?'premium':/enhanced|improved/i.test(v.name)?'enhanced':'default'}));
}
function sortVoices(list){
  const loc=(navigator.language||'en-US').replace('_','-');
  return list.slice().sort((a,b)=>(Q_RANK[b.q]||0)-(Q_RANK[a.q]||0)||((b.lang===loc)-(a.lang===loc))||a.name.localeCompare(b.name));
}
function refreshVoices(){if(NATIVE)native({type:'voices'});else{VOICES=sortVoices(webVoices());if(VOICE_OPEN)renderVoices()}}
window.duoVoices=list=>{VOICES=sortVoices(list||[]);if(VOICE_OPEN)renderVoices();const vr=$('#voiceRow .val span');vr&&(vr.textContent=voiceLabel())};
window.duoVoiceMsg=m=>toast(m);
if('speechSynthesis' in window&&!NATIVE)speechSynthesis.onvoiceschanged=()=>refreshVoices();
function voiceLabel(){
  const v=VOICES.find(x=>x.id===S.set.voice);
  if(v)return v.name;
  const best=VOICES.find(x=>x.q!=='personal');return best?`Automatic (${best.name})`:'Automatic';
}
function vRegion(l){const r=(l||'').split(/[-_]/)[1];return REGION[(r||'').toUpperCase()]||l}
function qBadge(q){return q==='premium'?'<span class="qb">Premium</span>':q==='enhanced'?'<span class="qb e">Enhanced</span>':q==='personal'?'<span class="qb p">Personal</span>':''}
function renderVoices(){
  const B=$('#infoBody'),cur=S.set.voice||'';
  const hasGood=VOICES.some(v=>v.q==='premium'||v.q==='personal');
  const best=VOICES.find(x=>x.q!=='personal');
  const CK='<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const row=(id,title,sub,on)=>`<div class="row vrow ${on?'on':''}" data-v="${esc(id)}" role="button" tabindex="0">${CK}<div class="vt"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div><button class="smp" data-s="${esc(id)}" aria-label="Play a sample">${PLAY}</button></div>`;
  const groups=[['personal','Your Voice'],['premium','Premium'],['enhanced','Enhanced'],['default','Standard']];
  B.innerHTML=`${hasGood?'':`<div class="guide"><h3>Get a voice that sounds human</h3><p>Apple’s Premium voices are much more natural than the built-in ones. They’re free. You download them once.</p>
    <ol><li>Open the <b>Settings</b> app.</li><li>Tap <b>Accessibility</b>, then <b>Read &amp; Speak</b> (called <b>Spoken Content</b> on some versions).</li><li>Tap <b>Voices</b>, then <b>English</b>.</li><li>Pick a voice marked <b>Premium</b>. Try <b>Ava</b>, <b>Zoe</b>, <b>Evan</b>, or <b>Nathan</b>. Tap to download.</li><li>Come back here and choose it.</li></ol></div>`}
  <div class="group">${row('','Automatic',best?`Uses the best voice you have: ${esc(best.name)}`:'Uses the best voice you have',!cur)}</div>
  ${groups.map(([q,label])=>{const list=VOICES.filter(v=>v.q===q);return list.length?`<div class="sec">${label}</div><div class="group">${list.map(v=>row(v.id,esc(v.name)+qBadge(v.q),esc(vRegion(v.lang)),cur===v.id)).join('')}</div>`:''}).join('')}
  ${NATIVE&&!VOICES.some(v=>v.q==='personal')?`<div class="sec">Personal Voice</div><div class="group"><button class="row blue" id="pvBtn">Use My Personal Voice</button></div><p class="muted" style="font-size:13px;margin:-14px 6px 24px;line-height:1.45">If you made a Personal Voice in Settings → Accessibility, your books can be read in your own voice.</p>`:''}
  ${VOICES.length?'':'<p class="muted" style="text-align:center;margin:20px 0">No English voices found.</p>'}
  <div class="sec">Speed</div>${seg('_rate',RATES.map(r=>[r,r+'×']))}`;
  B.querySelector('.seg[data-key=_rate]').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',+b.dataset.v===TTS.rate);b.onclick=()=>{setRate(+b.dataset.v);renderVoices()}});
  B.querySelectorAll('.vrow').forEach(r=>{
    const pick=()=>{haptic();S.set.voice=r.dataset.v;LS.set('dr.settings',S.set);B.querySelectorAll('.vrow').forEach(x=>x.classList.toggle('on',x===r));sampleVoice(r.dataset.v);if(TTS.on)ttsSpeakFrom(TTS.at||S.off)};
    r.onclick=e=>{if(e.target.closest('.smp'))return;pick()};
    r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}};
  });
  B.querySelectorAll('.smp').forEach(b=>b.onclick=()=>{haptic();sampleVoice(b.dataset.s)});
  $('#pvBtn')&&($('#pvBtn').onclick=()=>native({type:'personalVoice'}));
}
function sampleVoice(id){
  if(NATIVE){native({type:'voiceSample',id});return}
  if(!('speechSynthesis' in window))return;
  if(TTS.on&&TTS.playing)$('#ttsPP').click();
  speechSynthesis.cancel();
  const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.voiceURI===id)||vs.find(x=>x.voiceURI===(VOICES.find(y=>y.q!=='personal')||{}).id);
  const u=new SpeechSynthesisUtterance(`Hi, I’m ${v?v.name.replace(/\s*\(.*\)/,''):'your reader'}. It was the best of times, it was the worst of times.`);if(v){u.voice=v;u.lang=v.lang}u.rate=TTS.rate;speechSynthesis.speak(u);
}
function openVoices(){
  $('#infoTitle').textContent='Voice';VOICE_OPEN=true;refreshVoices();renderVoices();openSheet('#infoSheet');
}
new MutationObserver(()=>{if(!$('#infoSheet').classList.contains('open'))VOICE_OPEN=false}).observe($('#infoSheet'),{attributes:true,attributeFilter:['class']});
function setRate(r){TTS.rate=r;LS.set('dr.ttsRate',r);if(TTS.on)ttsSpeakFrom(TTS.at||S.off);renderTTS()}
function ttsStop(){
  TTS.on=false;TTS.playing=false;TTS.utt=null;TTS.gen++;
  if(NATIVE)native({type:'speechStop'});else if('speechSynthesis' in window)speechSynthesis.cancel();
  try{CSS.highlights&&CSS.highlights.delete('tts')}catch(_){}
  renderTTS();
}
function ttsHighlight(off,len){
  if(!(window.CSS&&CSS.highlights&&window.Highlight)||!S.idx.length)return;
  try{
    const a=nodeAt(off),na=S.idx[a].n,b=nodeAt(off+Math.max(1,len)-1),nb=S.idx[b].n;
    const r=document.createRange();r.setStart(na,Math.min(na.length,off-S.idx[a].s));r.setEnd(nb,Math.min(nb.length,off+len-S.idx[b].s));
    CSS.highlights.set('tts',new Highlight(r));
  }catch(_){}
}
window.duoSpeech=(ev,a,b)=>{
  if(ev==='range'){
    if(!TTS.on||S.ch!==TTS.ch||!S.book)return;
    if(!$('#coverScreen').hidden)return;
    let guard=0;while(a>=S.nextOff&&S.page<S.pages-1&&guard++<50)go(S.page+1,{anim:false});
    TTS.at=a;ttsHighlight(a,b);S.lastAct=Date.now();
  }else if(ev==='done'){
    if(!TTS.on)return;
    if(S.ch<S.book.chapters.length-1){renderChapter(S.ch+1,{});ttsSpeakFrom(0)}else{ttsStop();toast('That’s the end of the book.')}
  }else if(ev==='paused'){TTS.playing=false;renderTTS()}
  else if(ev==='playing'){TTS.playing=true;renderTTS()}
};
$('#ttsBtn').onclick=()=>{if(TTS.on){ttsStop();return}setChrome(false);ttsSpeakFrom(S.off);haptic()};
$('#ttsPP').onclick=()=>{
  if(TTS.playing){TTS.playing=false;if(NATIVE)native({type:'speechPause'});else speechSynthesis.pause()}
  else{TTS.playing=true;if(NATIVE)native({type:'speechResume'});else speechSynthesis.resume()}
  renderTTS();
};
$('#ttsRate').onclick=()=>{const i=RATES.indexOf(TTS.rate);setRate(RATES[(i+1)%RATES.length])};
$('#ttsLbl').onclick=()=>openVoices();
$('#ttsX').onclick=ttsStop;
loadLibrary().then(()=>{
  const sp=$('#splash');requestAnimationFrame(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500)});
  if(!LS.get('dr.welcomed',0))showWelcome();
  native({type:'ready'});sendState();
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(NATIVE)document.documentElement.classList.add('native');
})();
</script>
</body>
