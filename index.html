try{var s=JSON.parse(localStorage.getItem('dr.settings')||'{}'),T={bright:'#ffffff',cream:'#fbf7ee',sepia:'#f3e9d2',linen:'#eeeae2',sage:'#e8eee4',mist:'#edf1f6',rose:'#f8eeee',slate:'#2a2e35',night:'#0f1a2e',midnight:'#000000',ember:'#1d1712',forest:'#142019',hc:'#ffffff',hcdark:'#000000'},t=s.theme||'original',d=matchMedia('(prefers-color-scheme: dark)').matches;
var bg=t==='original'?(d?'#121214':'#ffffff'):(T[t]||'#ffffff');document.documentElement.style.background=bg;document.documentElement.style.setProperty('--paper',bg);}catch(e){}

<style>
@font-face{font-family:'Literata';src:url(fonts/Literata.woff) format('woff');font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url(fonts/Literata-Italic.woff) format('woff');font-weight:200 900;font-style:italic;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url(fonts/Atkinson-Regular.woff) format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url(fonts/Atkinson-Bold.woff) format('woff');font-weight:600 700;font-style:normal;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url(fonts/Atkinson-Italic.woff) format('woff');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Lexend';src:url(fonts/Lexend.woff) format('woff');font-weight:100 900;font-style:normal;font-display:swap}
/* Layout: Apple-style library (large title, segmented filter, cover grid) and a full-screen book that is one page folded, a two-page spread open. */
:root{
  --paper:#ffffff; --ink:#1d1d1f; --muted:#86868b; --accent:#007aff; --danger:#ff3b30; --green:#34c759;
  --cell:#ffffff; --segon:#ffffff;
  --surface:color-mix(in srgb,var(--ink) 5%,var(--paper));
  --surface2:color-mix(in srgb,var(--ink) 9%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 14%,transparent);
  --glass:color-mix(in srgb,var(--paper) 90%,transparent);
  --fold:color-mix(in srgb,var(--ink) 5%,transparent);
  --fold2:color-mix(in srgb,var(--ink) 13%,transparent);
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Helvetica Neue',Arial,sans-serif;
  --titlefont:ui-serif,'New York','Iowan Old Style',Georgia,serif;
  --rfont:ui-serif,'New York','Iowan Old Style',Georgia,serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{--paper:#121214;--ink:#ececf1;--muted:#8e8e93;--accent:#0a84ff;--cell:#1f1f23;--segon:#3a3a3f;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--paper)}
@media (display-mode: standalone){#reader{bottom:auto;height:100lvh;min-height:100%}body{min-height:100lvh}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .3s}
body.reading{overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Library ---------- */
#library{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:8px 48px}
.lib-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:30px}
.lib-title{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.012em}
.tools{display:flex;gap:10px;align-items:center;padding-bottom:3px}
.round{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:0;display:grid;place-items:center;color:var(--accent);cursor:pointer;position:relative}
.round input{display:none}
.ringbtn{background:none;width:40px;height:40px}
.ringbtn svg{width:40px;height:40px}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 6px;font-size:13px;font-weight:500;min-height:30px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
#filter{margin-top:18px;max-width:520px}
.hero{position:relative;overflow:hidden;border-radius:18px;width:100%;border:0;padding:0;text-align:left;cursor:pointer;background:var(--surface);margin-top:20px;display:block}
.hero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.4);opacity:.6}
.hero-in{position:relative;display:flex;gap:20px;align-items:center;padding:20px;background:color-mix(in srgb,var(--paper) 62%,transparent)}
.hero .cv{width:96px;flex:none}
.hero .hr{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ht{font-family:var(--titlefont);font-weight:600;font-size:23px;line-height:1.2;margin:4px 0 2px;text-wrap:balance}
.ha{color:var(--muted);font-size:15px}
.hm{color:var(--muted);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .bar{max-width:280px;margin-top:12px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 14px}
.shelf-h h2{margin:0;font-size:22px;font-weight:700}
.shelf-h span{color:var(--muted);font-size:14px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:30px 20px}
.card{min-width:0}
.open-b{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;transition:transform .2s}
.open-b:active{transform:scale(.97)}
.cv{container-type:inline-size;aspect-ratio:2/3;max-width:100%;border-radius:3px 5px 5px 3px;overflow:hidden;position:relative;background:var(--surface2);
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 4px 10px -2px rgba(0,0,0,.18),0 20px 30px -20px rgba(0,0,0,.5)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2) 0,rgba(255,255,255,.14) 2.5%,rgba(0,0,0,.06) 5%,transparent 9%);pointer-events:none}
.gen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:16% 12% 13% 15%;color:#f6f2ea;position:relative}
.gen::before{content:"";position:absolute;inset:6% 7% 6% 10%;border:1px solid rgba(246,242,234,.28);border-radius:2px}
.gen b{font-family:var(--titlefont);font-weight:600;font-size:clamp(10px,13cqw,22px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere;position:relative}
.gen span{font-size:clamp(7px,7.5cqw,11px);letter-spacing:.1em;text-transform:uppercase;opacity:.82;position:relative}
.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin-top:10px}
.meta .tx{min-width:0}
.meta .t{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .a{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border-radius:5px;padding:2px 6px}
.badge.done{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.more{flex:none;width:32px;height:32px;margin:-4px -6px 0 0;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center;cursor:pointer}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.empty{grid-column:1/-1;color:var(--muted);padding:40px 0;text-align:center}
.hint{margin-top:40px;color:var(--muted);font-size:13px;line-height:1.5;max-width:62ch}
.drop{outline:2px dashed var(--accent);outline-offset:8px;border-radius:12px}

/* ---------- Reader ---------- */
#reader{position:fixed;inset:0;background:var(--paper);color:var(--ink);z-index:5;overflow:hidden;
  --fs:19px;--lh:1.5;--margin:28px;--gap:56px;--colh:600px;
  --sideL:calc(max(16px,env(safe-area-inset-left,0px)) + var(--margin) - 16px);
  --sideR:calc(max(16px,env(safe-area-inset-right,0px)) + var(--margin) - 16px);
  --topH:calc(env(safe-area-inset-top,0px) + 34px); --botH:calc(env(safe-area-inset-bottom,0px) + 30px)}
@media (max-height:520px){#reader{--topH:calc(env(safe-area-inset-top,0px) + 28px);--botH:calc(env(safe-area-inset-bottom,0px) + 24px)}}
.rh,.rf{position:absolute;left:var(--sideL);right:var(--sideR);display:grid;grid-template-columns:1fr;column-gap:var(--gap);color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.rh{top:0;height:var(--topH);align-items:end;padding-bottom:7px}
.rf{bottom:0;height:var(--botH);align-items:start;padding-top:6px}
.rh span,.gh{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.rf span,.gf{font-size:12px;letter-spacing:.01em}
.rh span,.rf span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;min-width:0}
#headL,#folioL,#folioR{display:none}
.spread .rh,.spread .rf{grid-template-columns:1fr 1fr}
.spread #headL{display:block}
.spread #folioL{display:block;text-align:left}
.spread #folioR{display:block;text-align:right}
.spread #folioMid{display:none}
#area{position:absolute;top:var(--topH);bottom:var(--botH);left:var(--sideL);right:var(--sideR);overflow:hidden;touch-action:none}
#reader{touch-action:none;-webkit-touch-callout:none}
body.reading,html:has(body.reading){overscroll-behavior:none}
.flow .cont{text-indent:0!important}
.dropcaps .flow .cont::first-letter{float:none!important;font-size:inherit!important;line-height:inherit!important;padding:0!important;font-weight:inherit!important;color:inherit!important}
.justify .flow .cutend{text-align-last:justify}
.pfrag{position:absolute;left:0;top:0;column-count:auto!important}
#curl .view{position:absolute;inset:0;background:var(--paper);will-change:transform}
#curl .view.old{box-shadow:0 0 28px rgba(0,0,0,.14)}
#curl .face.clear{background:transparent}
#curl .vfold{position:absolute;background:linear-gradient(90deg,transparent 0,var(--fold) 36%,var(--fold2) 50%,var(--fold) 64%,transparent 100%)}
#curl .leaf{will-change:transform}
.flow{font-family:var(--rfont);font-size:var(--fs);line-height:var(--lh);column-fill:auto;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;font-kerning:normal;text-rendering:optimizeLegibility;-webkit-user-select:text;user-select:text}
.flow p{margin:0;text-indent:1.4em;orphans:2;widows:2;hanging-punctuation:allow-end}
.flow .orn{height:calc(var(--colh) * .16);display:flex;align-items:flex-end;justify-content:flex-start;padding-bottom:1.1em;break-after:avoid}
.flow .orn::after{content:"";width:2.2em;height:2px;border-radius:1px;background:var(--accent);opacity:.75}
.flow .opener{font-size:1.65em!important;line-height:1.15!important;font-weight:600;letter-spacing:-.012em;margin:0 0 1.15em!important;text-align:left}
.dropcaps .flow .opener+p{display:flow-root;text-indent:0}
.dropcaps .flow .opener+p::first-letter{float:left;font-size:3.15em;line-height:.86;padding:.07em .1em 0 0;font-weight:600;color:var(--ink);font-variant-caps:normal;letter-spacing:0}
.flow .opener+p{text-indent:0}
.flow .lead{font-variant-caps:all-small-caps;letter-spacing:.06em;font-size:1.06em}
.flow :is(h1,h2,h3,h4,h5,h6)+p,.flow p:first-child,.flow hr+p,.flow blockquote+p,.flow div+p{text-indent:0}
.dropcaps .flow :is(h1,h2)+p{display:flow-root}
.dropcaps .flow :is(h1,h2)+p::first-letter{float:left;font-size:3.15em;line-height:.86;padding:.07em .1em 0 0;font-weight:600;color:var(--ink);font-variant-caps:normal;letter-spacing:0}
.justify .flow p{text-align:justify}
.flow h1,.flow h2,.flow h3,.flow h4{font-weight:600;line-height:1.25;text-indent:0;margin:1.3em 0 .9em;break-after:avoid;text-wrap:balance}
.flow h1{font-size:1.5em;margin-top:2.4em;letter-spacing:-.005em}
.flow h2{font-size:1.25em}
.flow h3{font-size:1.08em}
.flow h1:first-child,.flow h2:first-child{margin-top:1.8em}
.flow img,.flow svg{display:block;max-width:100%;max-height:var(--colh);height:auto;width:auto;margin:.6em auto;object-fit:contain;break-inside:avoid}
.flow blockquote{margin:1em 1.2em;font-size:.95em}
.flow ul,.flow ol{padding-left:1.4em;margin:.6em 0}
.flow li{margin:.2em 0}
.flow hr{border:0;text-align:center;margin:1.2em 0;height:1.2em}
.flow hr::before{content:"⁂";color:var(--muted)}
.flow table{border-collapse:collapse;font-size:.9em;max-width:100%}
.flow td,.flow th{border:1px solid var(--line);padding:.2em .4em}
.flow pre{white-space:pre-wrap;font-size:.85em}
.flow a{color:inherit}
.flow .ilink{color:var(--accent);text-decoration:none;cursor:pointer}
.flow sup .ilink,.flow .ilink sup{font-weight:600}
.flow .end{text-align:center;text-indent:0;color:var(--muted);font-style:italic;margin-top:2em}
mark.hl{color:inherit;border-radius:3px;padding:0 1px;margin:0 -1px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.yellow{background:rgba(255,204,0,.4)} .hl.green{background:rgba(52,199,89,.32)} .hl.blue{background:rgba(10,132,255,.28)} .hl.pink{background:rgba(255,55,95,.26)}
.hl.purple{background:none;text-decoration:underline;text-decoration-color:rgba(175,82,222,.95);text-decoration-thickness:2px;text-underline-offset:3px}
.hl.has-note::after{content:"";display:inline-block;width:.36em;height:.36em;border-radius:50%;background:var(--accent);vertical-align:.7em;margin-left:2px}
mark.found{color:inherit;border-radius:3px;background:rgba(255,159,10,.55);animation:found 3s ease forwards}
@keyframes found{0%,60%{background:rgba(255,159,10,.55)}100%{background:transparent}}
#fold{position:absolute;top:0;bottom:0;left:50%;width:var(--gap);transform:translateX(-50%);pointer-events:none;display:none;
  background:linear-gradient(90deg,transparent 0,var(--fold) 36%,var(--fold2) 50%,var(--fold) 64%,transparent 100%)}
.spread #fold{display:none}
#spine{position:absolute;top:0;bottom:0;left:calc(var(--spineX,50%) - var(--gap)/2);width:var(--gap);pointer-events:none;display:none;z-index:2;
  background:linear-gradient(90deg,transparent 0,var(--fold) 36%,var(--fold2) 50%,var(--fold) 64%,transparent 100%)}
.spread #spine{display:block}
#fold{z-index:1}
#spreadLayer{position:absolute;inset:0;z-index:0;background:var(--paper);display:flex;align-items:center;justify-content:center}
#spreadLayer img{width:100%;height:100%;object-fit:contain;display:block}
.spreadph{break-inside:avoid;-webkit-column-break-inside:avoid;break-before:column;-webkit-column-break-before:always;margin:0}
#curl .spimg{position:absolute;top:0;object-fit:contain;background:var(--paper)}
#ink{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .12s}
#reader.penmode #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
#reader.penmode .flow{-webkit-user-select:none;user-select:none}
#penBtn.on{background:var(--surface2)}
#penBar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:2px;padding:6px;border-radius:20px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:.5px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:calc(100% - 20px);overflow-x:auto}
#penBar .tool{width:42px;height:42px;border-radius:13px;border:0;background:none;display:grid;place-items:center;color:var(--ink);cursor:pointer;flex:none}
#penBar .tool.on{background:var(--surface2);color:var(--accent)}
#penBar .pc{width:26px;height:26px;border-radius:50%;border:0;margin:0 5px;cursor:pointer;flex:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
#penBar .pc.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
#penBar .sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--line);flex:none}
#penBar .pdone{border:0;background:var(--accent);color:#fff;font-weight:600;border-radius:13px;padding:0 14px;height:42px;cursor:pointer;flex:none;margin-left:4px}
#night{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;transition:opacity 2.5s ease}
#night .w{position:absolute;inset:0;background:#ff8a2a;mix-blend-mode:multiply}
#night .d{position:absolute;inset:0;background:#000}
input[type=time]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:0;border-radius:8px;padding:6px 10px}
#ribbon{position:absolute;top:0;right:calc(var(--sideR) + 6px);width:20px;height:calc(var(--topH) + 18px);background:#e5383b;z-index:2;pointer-events:none;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);transform:translateY(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 4px rgba(0,0,0,.2)}
#ribbon.on{transform:none}

/* page curl layer */
#curl{position:absolute;inset:0;z-index:2;pointer-events:none;perspective:2200px;perspective-origin:50% 50%}
#curl .face{position:absolute;top:0;height:100%;overflow:hidden;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden}
#curl .slice{position:absolute;overflow:hidden}
#curl .slice>.flow{position:absolute;left:0;top:0}
#curl .ghost{position:absolute;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;display:block}
#curl .leaf{position:absolute;top:0;height:100%;transform-style:preserve-3d}
#curl .leaf .face{left:0;width:100%}
#curl .leaf .back{transform:rotateY(180deg)}
#curl .inkface{position:absolute;pointer-events:none}
#curl .shade{position:absolute;inset:0;opacity:0;pointer-events:none}
#curl .front .shade{background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.04) 40%,rgba(0,0,0,.12))}
#curl .back .shade{background:linear-gradient(270deg,rgba(0,0,0,.25),rgba(0,0,0,.05) 35%,transparent)}
#curl .cast{position:absolute;top:0;height:100%;opacity:0;pointer-events:none}

/* chrome */
.chrome-bar{position:absolute;left:0;right:0;z-index:3;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
#bar{top:0;padding-top:max(env(safe-area-inset-top,0px),18px);display:flex;align-items:center;gap:2px;height:calc(max(env(safe-area-inset-top,0px),18px) + 52px);border-bottom:.5px solid var(--line)}
#bar .ttl{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
#bar2{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-top:12px;border-top:.5px solid var(--line)}
#bar2 .row2{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;max-width:720px;margin:0 auto;padding:0 8px}
#bar2 .row2 span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:500}
#scrub{width:100%;max-width:720px;display:block;margin:10px auto 0;accent-color:var(--accent)}
#bar,#bar2{transition:transform .45s cubic-bezier(.22,1.15,.36,1),opacity .25s}
#reader:not(.chrome) #bar{transform:translateY(-100%);opacity:0;pointer-events:none;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s,visibility 0s .28s}
#reader:not(.chrome) #bar2{transform:translateY(100%);opacity:0;pointer-events:none;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s,visibility 0s .28s}
.rh{transition:opacity .2s}
#reader.chrome .rh{opacity:0}
@media (max-width:560px){#bar .ttl{font-size:0}}
#bar{gap:0}
#scrub{-webkit-appearance:none;appearance:none;height:28px;background:transparent}
#scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--surface2) var(--p,0%))}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.08)}
#scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--surface2)}
#scrub::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
#scrub::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ib{width:44px;height:44px;border:0;background:none;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--accent)}
.ib:active{background:var(--surface2)}
.ib .aa{font-family:var(--titlefont);font-size:19px;font-weight:600;letter-spacing:-.02em}
#bmBtn.on svg{fill:currentColor}

/* ---- redesign: glass controls ---- */
.glass{background:color-mix(in srgb,var(--paper) 58%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);
  border:.5px solid color-mix(in srgb,var(--ink) 12%,transparent);box-shadow:0 12px 32px -10px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.06),inset 0 1px 0 color-mix(in srgb,#fff 40%,transparent)}
#bar.chrome-bar{background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:0!important;pointer-events:none;height:auto!important;
  padding:max(env(safe-area-inset-top,0px),14px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))!important;display:flex;align-items:center;justify-content:space-between;gap:10px}
#bar>*{pointer-events:auto}
#bar .ttl{display:none}
#toLib.glass{width:46px;height:46px;border-radius:50%;color:var(--ink)}
#bar .pillgrp{display:flex;align-items:center;border-radius:26px;padding:2px 4px}
#bar .pillgrp .ib{width:44px;height:44px;color:var(--ink)}
#bar .pillgrp .ib.on,#bmBtn.on{color:var(--accent)}
#bar2.chrome-bar{left:50%;right:auto;width:min(640px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));transform:translateX(-50%);
  bottom:max(env(safe-area-inset-bottom,0px),12px);border-radius:24px;padding:12px 18px 8px!important;border-top:0!important}
#reader:not(.chrome) #bar{transform:translateY(-130%)!important}
#reader:not(.chrome) #bar2{transform:translate(-50%,140%)!important}
#reader.chrome #bar2{transform:translateX(-50%)}
#bar2 .row2{padding:0!important}
#bar2.glass{background:color-mix(in srgb,var(--paper) 88%,transparent)}
#reader.chrome .rf{opacity:0}
.rf{transition:opacity .2s}
#scrub{margin-top:6px!important}

/* ---- redesign: library ---- */
.today{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sum{color:var(--muted);font-size:15px;margin-top:6px}
.sum b{color:var(--ink);font-weight:600}
.round.glass{background:color-mix(in srgb,var(--paper) 58%,transparent)}
.hero{border-radius:24px!important;margin-top:22px!important;box-shadow:0 20px 40px -24px rgba(0,0,0,.45)}
.hero-bg{opacity:.95!important;filter:blur(46px) saturate(1.5)!important}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
.hero-in{background:none!important;padding:24px!important;gap:24px!important;z-index:1}
.hero .cv{width:118px!important;transform:rotate(-2deg);box-shadow:0 2px 4px rgba(0,0,0,.2),0 26px 40px -14px rgba(0,0,0,.6)!important}
.hero .eyebrow,.hero .ha,.hero .hm{color:rgba(255,255,255,.78)!important}
.hero .ht{color:#fff;font-size:26px!important;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.hero .bar{background:rgba(255,255,255,.28)!important}
.hero .bar i{background:#fff!important}
.resume{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:#fff;color:#111;font-weight:600;font-size:15px;border-radius:999px;padding:8px 16px}
.card .bar{margin-top:10px;height:3px}
.card .cv{transition:transform .25s cubic-bezier(.22,1.2,.36,1),box-shadow .25s}
.open-b:active .cv{transform:scale(.96)}
.done-chip{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:2}
.done-chip svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.meta{margin-top:12px!important}

/* ---- designed covers ---- */
.gen{--g:#d9b46a;--fg:#f6f1e6}
.gen.s-cloth{color:var(--fg);align-items:center;text-align:center;justify-content:center!important;gap:6cqw;padding:14% 13%!important}
.gen.s-cloth::before{inset:5% 6%!important;border:1px solid color-mix(in srgb,var(--g) 70%,transparent)!important;border-radius:2px}
.gen.s-cloth::after{content:"";position:absolute;inset:7.2% 8.2%;border:.5px solid color-mix(in srgb,var(--g) 45%,transparent);pointer-events:none}
.gen.s-cloth b{color:var(--g);font-size:clamp(10px,12.5cqw,26px)!important;letter-spacing:.01em}
.gen.s-cloth i{display:block;width:16cqw;height:1px;background:var(--g);opacity:.8;position:relative}
.gen.s-cloth span{color:var(--g);opacity:.9;font-size:clamp(7px,6.4cqw,12px)!important;letter-spacing:.14em}
.gen.s-block{padding:0!important;justify-content:flex-start!important}
.gen.s-block .top{flex:1;padding:14% 11% 0;display:flex;flex-direction:column;gap:5cqw;position:relative}
.gen.s-block b{color:var(--fg);font-size:clamp(11px,15cqw,30px)!important;line-height:1.02!important;letter-spacing:-.01em}
.gen.s-block .bot{background:var(--fg);color:#222;padding:8% 11%;font-size:clamp(7px,6.4cqw,12px);letter-spacing:.12em;text-transform:uppercase;font-weight:600;position:relative}
.gen.s-block .rule{width:22cqw;height:3px;background:var(--g)}
.gen.s-stripe{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 14px)!important;justify-content:center!important;align-items:center;padding:12%!important}
.gen.s-stripe .lab{background:var(--fg);color:#1d1d1f;border-radius:3px;padding:12% 9%;text-align:center;width:100%;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gen.s-stripe .lab b{color:#1d1d1f;font-size:clamp(10px,11cqw,22px)!important;display:block}
.gen.s-stripe .lab span{display:block;color:#555;margin-top:5cqw;font-size:clamp(7px,5.6cqw,11px)!important;letter-spacing:.12em;opacity:1}
.gen.s-orb{justify-content:flex-end!important;gap:5cqw}
.gen.s-orb .orb{position:absolute;width:86cqw;height:86cqw;border-radius:50%;right:-26cqw;top:-18cqw;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--g) 95%,#fff),var(--g) 45%,color-mix(in srgb,var(--g) 60%,#000));opacity:.9}
.gen.s-orb b{color:var(--fg);font-size:clamp(11px,14cqw,28px)!important;line-height:1.05!important}
.gen.s-orb span{color:var(--fg)}

/* sheets */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(540px,100%);max-height:88%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);
  border-radius:14px 14px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.22);transform:translate(-50%,105%);visibility:hidden;
  transition:transform .26s cubic-bezier(.4,0,.8,.4),visibility 0s .26s}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .5s cubic-bezier(.22,1.22,.36,1)}
.sheet.dragging{transition:none!important}
@media (min-width:760px) and (min-height:560px){
  .sheet{top:50%;bottom:auto;max-height:82%;border-radius:16px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .25s ease,opacity .25s ease,visibility 0s .25s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;transition:transform .42s cubic-bezier(.22,1.25,.36,1),opacity .2s ease}
  .grab{display:none}
}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:7px auto 0;flex:none}
.sheet>.grab,.sheet>header{touch-action:none;cursor:grab}
.preview{border-radius:12px;padding:16px 18px;margin-bottom:24px;border:.5px solid var(--line);line-height:1.5;max-height:150px;overflow:hidden}
.preview b{display:block;font-size:.75em;letter-spacing:.08em;text-transform:uppercase;font-family:var(--ui);font-weight:600;opacity:.6;margin-bottom:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#curl .bleed{opacity:.07;background:transparent!important;pointer-events:none}
#flyer{position:fixed;z-index:80;pointer-events:none;transform-origin:0 0;will-change:transform,opacity}
#flyer .cv{width:100%;height:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.55)}
#splash{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:var(--paper);transition:opacity .45s ease}
#splash img{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#splash.out{opacity:0;pointer-events:none}
#welcome{position:fixed;inset:0;z-index:85;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 30px) max(28px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(28px,env(safe-area-inset-left,0px));animation:fadein .4s ease}
#welcome .art{width:min(240px,60vw);height:auto;margin-bottom:28px;color:var(--accent)}
#welcome h2{font-family:var(--titlefont);font-size:28px;font-weight:600;margin:0 0 10px;text-wrap:balance}
#welcome p{color:var(--muted);font-size:17px;line-height:1.45;margin:0 0 30px;max-width:30ch}
#welcome .dots{display:flex;gap:8px;margin-bottom:24px}
#welcome .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
#welcome .dots i.on{background:var(--ink)}
#welcome .btn{min-width:220px}
#welcome .skip{background:none;border:0;color:var(--muted);font-size:15px;margin-top:14px;cursor:pointer;padding:8px}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 18px;flex:none}
.sheet>header h2{margin:0;font-size:17px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done{color:var(--accent);font-weight:600;background:none;border:0;font-size:17px;min-height:44px;padding:0 10px;cursor:pointer;flex:none}
.sbody{overflow:auto;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.glabel{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:0 0 7px 16px}
.group{background:var(--cell);border-radius:12px;overflow:hidden;margin-bottom:24px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:8px 16px;width:100%;border:0;border-bottom:.5px solid var(--line);background:none;font-size:16px;text-align:left;color:var(--ink);cursor:pointer}
.row:last-child{border-bottom:0}
.row.static{cursor:default}
.row .chk{color:var(--accent);visibility:hidden}
.row.on .chk{visibility:visible}
.row.red{color:var(--danger)}
.row.blue{color:var(--accent)}
.row small{color:var(--muted);font-size:14px}
.tog{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--surface2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.tog::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.tog:checked{background:var(--green)}
.tog:checked::before{transform:translateX(20px)}
.sizer{display:flex;align-items:center}
.sizer button{flex:1;height:50px;border:0;background:none;cursor:pointer;font-family:var(--titlefont);color:var(--ink)}
.sizer button+output{border-left:.5px solid var(--line);border-right:.5px solid var(--line)}
.sizer output{flex:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;line-height:50px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-bottom:24px}
.th{border-radius:12px;height:76px;border:.5px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;font-size:12px;cursor:pointer;padding:0}
.th b{font-family:var(--titlefont);font-size:23px;font-weight:600;line-height:1}
.th.on{outline:2.5px solid var(--accent);outline-offset:2px}
.slrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:.5px solid var(--line)}
.slrow input{flex:1;accent-color:var(--accent)}
.slrow span{color:var(--muted);font-size:14px;width:28px;text-align:center}
.srow{padding:10px 16px;border-bottom:.5px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .lbl{font-size:13px;color:var(--muted);margin-bottom:8px}
.list{list-style:none;margin:0;padding:0}
.toc button{font-family:var(--titlefont);font-size:17px;line-height:1.3}
.toc .row.on{font-weight:600}
.toc .row.on .chk{visibility:visible}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:.5px solid var(--line);background:none;padding:12px 16px;cursor:pointer;color:var(--ink)}
.item:last-child{border-bottom:0}
.item .q{font-family:var(--titlefont);font-size:16px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.item .n{font-size:14px;margin-top:6px;color:var(--ink);opacity:.85}
.item .c{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.yellow{background:#ffcc00}.dot.green{background:#34c759}.dot.blue{background:#0a84ff}.dot.pink{background:#ff375f}.dot.purple{background:#af52de}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:0 10px;margin:0 0 16px;color:var(--muted)}
.searchbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);height:40px;outline:none}
.res b{background:rgba(255,204,0,.45);color:inherit;font-weight:inherit;border-radius:2px}
.muted{color:var(--muted)}
.def h3{font-family:var(--titlefont);font-size:28px;margin:4px 0 0}
.def .ph{color:var(--muted);margin-bottom:12px}
.def .pos{font-style:italic;color:var(--muted);margin:14px 0 4px}
.def ol{margin:0;padding-left:1.3em;line-height:1.45}
.def li{margin:.35em 0}
.def .ex{color:var(--muted);font-style:italic}
.linkrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 14px;background:var(--cell);color:var(--accent);text-decoration:none;font-weight:600;font-size:15px;border:0;cursor:pointer}
.note-pop{font-family:var(--rfont);font-size:17px;line-height:1.5}
.colors{display:flex;gap:14px;padding:14px 16px;border-bottom:.5px solid var(--line)}
.colors button{width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;position:relative}
.colors button.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--accent)}
.colors .purple{background:none!important;border:2px solid #af52de}
.colors .purple::before{content:"U";font-family:var(--titlefont);font-weight:700;color:#af52de;text-decoration:underline;position:absolute;inset:0;display:grid;place-items:center}
textarea{width:100%;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:12px 16px;min-height:110px;resize:vertical;outline:none;display:block}
.quote{font-family:var(--titlefont);font-size:17px;line-height:1.45;padding:14px 16px;border-bottom:.5px solid var(--line)}
.bk-head{display:flex;gap:14px;align-items:center;margin:2px 0 20px}
.bk-head .cv{width:60px;flex:none}
.bk-head .t{font-family:var(--titlefont);font-weight:600;font-size:19px;line-height:1.2}
.bk-head .a{color:var(--muted);font-size:14px;margin-top:2px}

/* stats */
.ringbig{display:flex;align-items:center;gap:20px;margin:4px 0 24px}
.ringbig svg{width:118px;height:118px;flex:none}
.ringbig .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.ringbig .sub{color:var(--muted);font-size:15px;margin-top:2px}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:600;color:#ff9500}

.weekc{padding:14px 12px 6px}
.weekc svg{width:100%;height:auto;display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.tile{background:var(--cell);border-radius:12px;padding:14px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}

/* selection menu */
#selMenu{position:fixed;z-index:35;display:flex;align-items:center;gap:2px;padding:5px;border-radius:14px;background:color-mix(in srgb,var(--ink) 90%,var(--paper));color:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 20px);overflow-x:auto}
#selMenu .c{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--paper) 30%,transparent);cursor:pointer;flex:none;margin:0 3px;padding:0}

#selMenu .a{border:0;background:none;padding:8px 10px;font-size:15px;cursor:pointer;border-radius:9px;white-space:nowrap;color:inherit}

/* cover-on-fold + finish */
.overlay{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;overflow:hidden;background:var(--paper);
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px));cursor:pointer;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.overlay .bgimg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.4);opacity:.35}
.overlay>*:not(.bgimg){position:relative}
.overlay .cv{width:min(44vw,200px,32vh);box-shadow:0 2px 4px rgba(0,0,0,.15),0 30px 60px -20px rgba(0,0,0,.6)}
.overlay .t{font-family:var(--titlefont);font-weight:600;font-size:22px;line-height:1.2;max-width:22ch;text-wrap:balance}
.overlay .a{color:var(--muted);font-size:15px;margin-top:-8px}
.overlay .bar{width:180px}
.overlay .m{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.overlay .tap{color:var(--accent);font-weight:600;font-size:15px;margin-top:6px}
.fin h3{font-family:var(--titlefont);font-size:28px;margin:0;font-weight:600}
.fin .row3{display:flex;gap:26px;margin:4px 0 6px}
.fin .row3 b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.fin .row3 span{color:var(--muted);font-size:12px}
.fin .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

async function openZip(buf){

  if(!ci){const m=tags(opf,'meta').find(m=>m.getAttribute('name')==='cover');if(m)ci=man.get(m.getAttribute('content'))}
  if(!ci)ci=items.find(m=>/^image\//.test(m.type)&&/cover/i.test(m.href));
  let cover=null;
  if(ci&&/^image\//.test(ci.type)){const b=await z.bytes(ci.href);if(b)cover={type:ci.type,buf:b.slice().buffer}}
  if(!full)return{title,author,cover};
  const spine=tags(opf,'itemref').filter(r=>r.getAttribute('linear')!=='no').map(r=>man.get(r.getAttribute('idref'))).filter(m=>m&&/html|xml/.test(m.type));
  const spineIdx=new Map(spine.map((m,i)=>[m.href,i]));
  const blobs=new Map(),urls=[],imgs={};
  const urlFor=async path=>{
    if(blobs.has(path))return blobs.get(path);
    const b=await z.bytes(path);if(!b){blobs.set(path,'');return''}
    const m=items.find(x=>x.href===path);const u=URL.createObjectURL(new Blob([b],{type:m?.type||''}));
    blobs.set(path,u);urls.push(u);imgs[path]={type:m?.type||'',buf:b.slice().buffer};return u;
  };
  const chapters=[];
  for(const it of spine){
    const src=await z.text(it.href);
    if(src==null){chapters.push({title:'',html:''});continue}
    const d=xml(src);const body=d.getElementsByTagNameNS('*','body')[0]||d.body;
    const div=document.createElement('div');
    if(body)for(const n of [...body.childNodes])div.appendChild(document.importNode(n,true));
    await clean(div,it.href,urlFor,spineIdx);
    const h=div.querySelector('h1,h2,h3');
    chapters.push({title:h?h.textContent.trim().replace(/\s+/g,' ').slice(0,90):'',html:div.innerHTML});
  }
  let toc=[];
  const entry=(label,full)=>{const[p,f]=full.split('#');return{label:(label||'').trim().replace(/\s+/g,' '),ch:spineIdx.has(p)?spineIdx.get(p):-1,frag:f||''}};
  const navItem=items.find(m=>/\bnav\b/.test(m.props));
  if(navItem){
    const nd=xml(await z.text(navItem.href));const navs=tags(nd,'nav');
    const nav=navs.find(n=>/toc/.test(n.getAttribute('epub:type')||n.getAttributeNS('http://www.idpf.org/2007/ops','type')||''))||navs[0];
    if(nav)tags(nav,'a').forEach(a=>{const h=a.getAttribute('href');if(h)toc.push(entry(a.textContent,resolve(navItem.href,h)))});
  }
  if(!toc.filter(t=>t.ch>=0).length){
    toc=[];const ncx=items.find(m=>/dtbncx/.test(m.type));
    if(ncx){const nd=xml(await z.text(ncx.href));tags(nd,'navPoint').forEach(np=>{const l=tags(np,'text')[0],c=tags(np,'content')[0];if(c)toc.push(entry(l?l.textContent:'',resolve(ncx.href,c.getAttribute('src')||'')))})}
  }
  toc=toc.filter(t=>t.ch>=0&&t.label);
  return{title,author,chapters,toc,urls,imgs,blobs};
}
async function clean(root,base,urlFor,spineIdx){
  root.querySelectorAll('script,style,link,meta,iframe,object,embed,form,input,button,select,textarea,audio,video,title,head,noscript').forEach(e=>e.remove());
  const SVG='http://www.w3.org/2000/svg';
  for(const el of root.querySelectorAll('*')){
    const isSvg=el.namespaceURI===SVG;
    for(const a of [...el.attributes]){
      const n=a.name.toLowerCase();
      if(n.startsWith('on')||n==='style'){el.removeAttribute(a.name);continue}
      if(n==='id'){el.setAttribute('id','b-'+a.value);continue}
      if(!isSvg&&(n==='class'||n==='width'||n==='height'||n==='align'||n==='bgcolor'))el.removeAttribute(a.name);
    }
  }
  for(const img of root.querySelectorAll('img')){const s=img.getAttribute('src');if(s&&!/^(data|https?):/i.test(s))img.setAttribute('src',await urlFor(resolve(base,s).split('#')[0]));img.setAttribute('alt',img.getAttribute('alt')||'')}
  for(const im of [...root.getElementsByTagNameNS(SVG,'image')]){
    const s=im.getAttribute('href')||im.getAttributeNS('http://www.w3.org/1999/xlink','href');
    if(s&&!/^data:/i.test(s)){const u=await urlFor(resolve(base,s).split('#')[0]);im.setAttribute('href',u);im.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',u)}
  }
  for(const a of root.querySelectorAll('a[href]')){
    const h=a.getAttribute('href');
    if(/^https?:/i.test(h)){a.target='_blank';a.rel='noopener';continue}
    a.removeAttribute('href');
    const[p,f]=resolve(base,h).split('#');const ch=spineIdx.get(p);
    if(ch!=null){a.dataset.ch=ch;if(f)a.dataset.frag=f;a.setAttribute('role','link');a.classList.add('ilink')}
  }
}
function friendly(e,kind){

  if(/readable EPUB|table of parts|not well-formed|Invalid|null/i.test(m)||kind==='add')return kind==='add'?'That file couldn’t be read as a book. Try an EPUB or a plain .txt file.':'This book couldn’t be opened. Try removing it and adding the file again.';
  if(/Update iOS/.test(m))return 'This book needs a newer version of iOS to open.';
  return 'This book couldn’t be opened. Try removing it and adding the file again.';
}
function readText(str,name){
  const paras=str.replace(/\r/g,'').split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean);
  const isHead=p=>p.length<70&&/^(chapter|book|part|prologue|epilogue|act)\b/i.test(p);
  const chapters=[];let cur=null;
  const push=()=>{if(cur&&cur.ps.length)chapters.push(cur)};
  for(const p of paras){
    if(isHead(p)){push();cur={title:p,ps:[]};continue}
    if(!cur||(cur.auto&&cur.ps.length>=60)){push();cur={title:'',ps:[],auto:true}}
    cur.ps.push(p);
  }
  push();
  if(!chapters.length)chapters.push({title:'',ps:['(This file is empty.)']});
  const out=chapters.map((c,i)=>{const t=c.title||(chapters.length>1?'Part '+(i+1):name);
    return{title:t,html:`<h2>${esc(t)}</h2>`+c.ps.map(p=>`<p>${esc(p)}</p>`).join('')}});
  return{title:name,author:'',chapters:out,toc:out.map((c,i)=>({label:c.title,ch:i,frag:''})),urls:[]};
}

  if(S.cols===2){$('#folioL').textContent=2*p+1;$('#folioR').textContent=2*p+2<=S.ncols?2*p+2:''}
  const chLeft=Math.max(0,S.book.lens[S.ch]-S.off)/S.rate;
  const left=S.pages-1-p;
  $('#folioMid').textContent=left?`${fmtMin(chLeft)} left in chapter`:'Last page of chapter';
  $('#chName').textContent=S.book.chapters[S.ch].head||'';
  $('#srStatus').textContent=`${S.book.chapters[S.ch].head||''}, page ${S.page+1} of ${S.pages}`;
  const bl=Math.max(0,S.book.total-globalOff())/S.rate;
  $('#leftLbl').textContent=`${fmtMin(chLeft)} left in chapter · ${Math.round(bookPct()*100)}%`;
  if(!scrubbing){$('#scrub').value=Math.round(bookPct()*1000);$('#scrub').style.setProperty('--p',(bookPct()*100)+'%')}

}

  }else{

let TURN=null;
function animateTurn(ctl,from,to,dur,fn){

    const k=Math.min(1,(now-t0)/dur),t=from+(to-from)*fn(k);ctl.set(t);
    if(k<1)TURN.raf=requestAnimationFrame(step);else endTurn();
  };
  TURN.raf=requestAnimationFrame(step);

function endTurn(){
  if(!TURN)return;const {ctl,to}=TURN;TURN=null;
  if(to>=1){ctl.clean();noteTurn(ctl.dir,ctl.prev)}else{ctl.back();ctl.clean()}
}

let pd=null,drag=null;
reader.addEventListener('pointerdown',e=>{
  if(e.target.closest('.chrome-bar,.overlay,#penBar'))return;
  if(pd&&pd.id!==e.pointerId&&Date.now()-pd.t<1500)return;
  const sel=getSelection();pd={id:e.pointerId,x:e.clientX,y:e.clientY,hadSel:!!(sel&&!sel.isCollapsed),t:Date.now(),hist:[[e.clientX,performance.now()]]};
});
reader.addEventListener('pointermove',e=>{
  if(!pd||e.pointerId!==pd.id)return;
  const dx=e.clientX-pd.x,dy=e.clientY-pd.y;
  pd.hist.push([e.clientX,performance.now()]);if(pd.hist.length>6)pd.hist.shift();
  if(!drag){
    if(Math.abs(dx)<10||Math.abs(dx)<Math.abs(dy)*1.2)return;
    const sel=getSelection();if(pd.hadSel||(sel&&!sel.isCollapsed))return;
    const dir=dx<0?1:-1;
    finishTurn();
    const ctl=makeTurn(dir);
    drag={dir,ctl,x0:e.clientX,end:!ctl&&dir>0&&atEnd()};
    if(ctl&&ctl.style==='none'){noteTurn(dir,ctl.prev);redrawInk();drag.done=true}
  }
  if(drag.ctl&&!drag.done){
    const W=reader.clientWidth,dist=S.cols===2&&drag.ctl.style==='curl'?W*.5:W*.8;
    const t=Math.max(0,Math.min(1,(drag.dir>0?drag.x0-e.clientX:e.clientX-drag.x0)/dist));
    drag.t=t;drag.ctl.set(t);
  }
});
function release(e,cancelled){
  if(!pd||e.pointerId!==pd.id)return;
  const p=pd;pd=null;S.lastAct=Date.now();
  if(drag){
    const d=drag;drag=null;
    if(d.end){if(Math.abs(e.clientX-p.x)>60)finishBook();return}
    if(!d.ctl||d.done)return;
    const h=p.hist,v=h.length>1?(h[h.length-1][0]-h[0][0])/Math.max(1,h[h.length-1][1]-h[0][1]):0;
    const vd=d.dir>0?-v:v,t=d.t||0;
    const commit=!cancelled&&(vd>.3||(t>.33&&vd>-.15));
    const to=commit?1:0,rem=Math.abs(to-t);if(commit)haptic();
    animateTurn(d.ctl,t,to,Math.max(120,Math.min(420,rem*(d.ctl.style==='curl'?560:380))),ease.out);
    return;
  }
  if(cancelled)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y,dt=Date.now()-p.t;
  const sel=getSelection();if(sel&&!sel.isCollapsed)return;
  if(p.hadSel){hideSel();return}
  if(Math.abs(dx)>=12||Math.abs(dy)>=12||dt>450)return;
  const mk=e.target.closest('mark.hl');if(mk){openHighlight(mk.dataset.id);return}
  if(e.target.closest('a,.ilink'))return;
  const W=innerWidth,fx=e.clientX/W,fy=e.clientY/innerHeight;
  if(fy<.12||fy>.88){setChrome(!S.chrome);return}
  if(fx<.26)turn(-1);else if(fx>.74)turn(1);else setChrome(!S.chrome);
}

function snippetAt(ch,off,n=110){const t=S.book.texts[ch]||'';let s=t.slice(off,off+n).replace(/\s+/g,' ').trim();return s+(t.length>off+n?'…':'')}

function runSearch(){
  const q=$('#q').value.trim(),out=$('#results');
  if(q.length<2){out.innerHTML='';return}
  const ql=q.toLowerCase(),b=S.book,res=[];
  for(let i=0;i<b.texts.length&&res.length<300;i++){
    const t=b.texts[i],tl=t.toLowerCase();let at=0,k;
    while((k=tl.indexOf(ql,at))>=0&&res.length<300){res.push({ch:i,off:k});at=k+ql.length}
  }

  let html=`<p class="muted" style="margin:0 0 10px 4px;font-size:13px">${res.length>=300?'300+':res.length} result${res.length===1?'':'s'}</p>`,lastCh=-1;
  for(const r of res){
    if(r.ch!==lastCh){if(lastCh>=0)html+='</div>';html+=`<div class="glabel">${esc(b.chapters[r.ch].head||'')}</div><div class="group">`;lastCh=r.ch}
    const t=b.texts[r.ch],a=Math.max(0,r.off-50),z=Math.min(t.length,r.off+q.length+70);
    html+=`<button class="item res" data-ch="${r.ch}" data-off="${r.off}"><div class="q" style="font-size:15px">${a>0?'…':''}${esc(t.slice(a,r.off)).replace(/\s+/g,' ')}<b>${esc(t.slice(r.off,r.off+q.length))}</b>${esc(t.slice(r.off+q.length,z)).replace(/\s+/g,' ')}${z<t.length?'…':''}</div></button>`;
  }
  out.innerHTML=html+'</div>';
  out.querySelectorAll('.res').forEach(el=>el.onclick=()=>{const ch=+el.dataset.ch,off=+el.dataset.off;closeSheets();finishAnim();renderChapter(ch,{off,flash:[off,off+q.length]})});

  let top=last.bottom+44;if(top+mh>innerHeight-10)top=first.top-mh-52;top=Math.max(10,Math.min(innerHeight-mh-10,top));

  const links=`<div class="linkrow"><a class="pill" href="https://translate.google.com/?sl=auto&tl=es&op=translate&text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Translate to Spanish</a><a class="pill" href="https://www.google.com/search?q=${encodeURIComponent('define '+word)}" target="_blank" rel="noopener">Search the Web</a></div>`;
  $('#infoTitle').textContent='Dictionary';
  $('#infoBody').innerHTML=`<div class="def"><h3>${esc(word||text)}</h3><p class="muted">Looking it up…</p></div>`;
  openSheet('#infoSheet');
  if(!word||word.split(/\s+/).length>3){$('#infoBody').innerHTML=`<div class="def"><h3>${esc(text.slice(0,60))}</h3><p class="muted">Select a single word to see its definition.</p></div>${links}`;return}
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word.toLowerCase()));
    if(r.status===404){$('#infoBody').innerHTML=`<div class="def"><h3>${esc(word)}</h3><p class="muted">No definition found.</p></div>${links}`;return}
    const data=await r.json();const e0=data[0];
    const ph=e0.phonetic||(e0.phonetics||[]).map(p=>p.text).find(Boolean)||'';
    const ms=data.flatMap(e=>e.meanings).slice(0,4);
    $('#infoBody').innerHTML=`<div class="def"><h3>${esc(e0.word)}</h3><div class="ph">${esc(ph)}</div>${ms.map(m=>`<div class="pos">${esc(m.partOfSpeech)}</div><ol>${m.definitions.slice(0,3).map(d=>`<li>${esc(d.definition)}${d.example?`<div class="ex">“${esc(d.example)}”</div>`:''}</li>`).join('')}</ol>`).join('')}</div>${links}`;
  }catch(_){
    $('#infoBody').innerHTML=`<div class="def"><h3>${esc(word)}</h3><p class="muted">You’re offline. Connect to the internet to look up words.</p></div>${links}`;
  }
}

/* ---------- settings ---------- */
$('#setBtn').onclick=()=>{renderSettings();openSheet('#setSheet')};
function seg(key,opts){return`<div class="seg" data-key="${key}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(S.set[key])===String(v)?'on':''}">${l}</button>`).join('')}</div>`}
function renderSettings(){
  const st=S.set;
  const tv=themeVals(),fst=(FONTS.find(f=>f[0]===st.font)||FONTS[0])[2];
  $('#setBody').innerHTML=`
  <div class="preview" id="pv" style="background:${tv.paper};color:${tv.ink};font-family:${fst};font-size:${Math.min(st.size,24)}px;line-height:${st.lh};text-align:${(st.justify===true)?'justify':'left'}"><b style="color:${tv.muted}">Preview</b>It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.</div>
  <div class="glabel">Theme</div>
  <div class="themes">${THEMES.map(t=>{const v=t.id==='original'?themeVals():t;const bg=t.id==='original'?'linear-gradient(135deg,#ffffff 50%,#121214 50%)':v.paper;
    return`<button class="th ${st.theme===t.id?'on':''}" data-theme="${t.id}" style="background:${bg};color:${t.id==='original'?'#86868b':v.ink}"><b style="${t.id==='original'?'color:#1d1d1f;text-shadow:0 0 0 #fff':''}">Aa</b><span style="${t.id==='original'?'color:#86868b':''}">${t.name}</span></button>`}).join('')}</div>
  <div class="glabel">Text size</div>
  <div class="group"><div class="sizer"><button id="fsDown" aria-label="Smaller text" style="font-size:15px">A</button><output>${st.size} pt</output><button id="fsUp" aria-label="Larger text" style="font-size:24px">A</button></div></div>
  <div class="glabel">Typeface</div>
  <div class="group">${FONTS.map(([id,name,stack])=>`<button class="row ${st.font===id?'on':''}" data-font="${id}"><span style="font-family:${stack};font-size:18px">${name}</span>${ICON.check}</button>`).join('')}</div>
  <div class="glabel">Layout</div>
  <div class="group">
    <div class="slrow"><span style="font-size:11px">≡</span><input id="lh" type="range" min="1.25" max="2" step="0.05" value="${st.lh}" aria-label="Line spacing"><span style="font-size:17px">☰</span></div>
    <div class="srow"><div class="lbl">Margins</div>${seg('margin',[[16,'Narrow'],[28,'Medium'],[44,'Wide']])}</div>
    <div class="srow"><div class="lbl">Pages</div>${seg('mode',[['auto','Auto'],['one','One'],['two','Two']])}</div>
    ${S.cols===2?`<div class="srow"><div class="lbl">Spine position · line it up with the fold</div><div style="display:flex;align-items:center;gap:10px"><input id="hingeAdj" type="range" min="-60" max="60" step="1" value="${st.hingeAdj||0}" style="flex:1;accent-color:var(--accent)" aria-label="Spine position"><button class="pill" id="hingeReset" style="padding:6px 12px;font-size:13px">Reset</button></div></div>`:''}
    <div class="srow"><div class="lbl">Hide controls after</div>${seg('autoHide',[[0,'Never'],[3,'3 sec'],[4,'4 sec'],[8,'8 sec']])}</div>
    <div class="srow"><div class="lbl">Page turn</div>${seg('turn',[['curl','Curl'],['slide','Slide'],['none','None']])}</div>
    <div class="srow"><div class="lbl">Justify text</div>${seg('justify',[['auto','Auto'],['true','On'],['false','Off']])}</div>
    <label class="row static"><span>Fancy chapter starts</span><input type="checkbox" class="tog" data-tog="dropcaps" ${st.dropcaps?'checked':''}></label>
    <label class="row static"><span>Show cover when folded</span><input type="checkbox" class="tog" data-tog="foldCover" ${st.foldCover?'checked':''}></label>
    <label class="row static"><span>Pictures across both pages</span><input type="checkbox" class="tog" data-tog="spreadPics" ${st.spreadPics?'checked':''}></label>
    <label class="row static"><span>Haptic taps</span><input type="checkbox" class="tog" data-tog="haptics" ${st.haptics?'checked':''}></label>
    <label class="row static"><span>Apple Pencil always writes</span><input type="checkbox" class="tog" data-tog="pencil" ${st.pencil?'checked':''}></label>
  </div>
  <div class="glabel">Bedtime</div>
  <div class="group">
    <div class="srow">${seg('bedtime',[['off','Off'],['auto','Scheduled'],['always','On Now']])}</div>
    ${st.bedtime==='auto'?`<div class="row static"><span>Starts</span><input type="time" id="bedStart" value="${st.bedStart}"></div><div class="row static"><span>Ends</span><input type="time" id="bedEnd" value="${st.bedEnd}"></div>`:''}
    <div class="slrow"><span style="width:auto;min-width:56px;text-align:left">Warmth</span><input id="warm" type="range" min="0" max=".6" step=".02" value="${st.warm}" aria-label="Warmth"></div>
    <div class="slrow" style="border-bottom:0"><span style="width:auto;min-width:56px;text-align:left">Dim</span><input id="dim" type="range" min="0" max=".6" step=".02" value="${st.dim}" aria-label="Dim"></div>
  </div>
  <p class="muted" style="font-size:13px;margin:-14px 16px 24px">Bedtime makes the screen warmer and dimmer so it’s easier on your eyes at night.</p>`;
  const B=$('#setBody');
  B.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{st.theme=b.dataset.theme;commit(false);applyTheme();redrawInk();renderSettings()});
  B.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{st.font=b.dataset.font;commit();renderSettings()});
  $('#fsDown').onclick=()=>{st.size=Math.max(13,st.size-1);st._sizeSet=1;commit();renderSettings()};
  $('#fsUp').onclick=()=>{st.size=Math.min(34,st.size+1);st._sizeSet=1;commit();renderSettings()};
  $('#lh').addEventListener('input',e=>{st.lh=+e.target.value;$('#pv').style.lineHeight=st.lh;commit()});
  B.querySelectorAll('.seg[data-key]').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=sg.dataset.key;st[k]=(k==='margin'||k==='autoHide')?+b.dataset.v:k==='justify'?(b.dataset.v==='auto'?'auto':b.dataset.v==='true'):b.dataset.v;commit(!['turn','bedtime','autoHide'].includes(k));if(k==='bedtime')applyBed();renderSettings()}));
  B.querySelectorAll('[data-tog]').forEach(t=>t.onchange=()=>{st[t.dataset.tog]=t.checked;commit(!['foldCover','pencil','haptics'].includes(t.dataset.tog))});
  if($('#hingeAdj')){let hT;$('#hingeAdj').addEventListener('input',e=>{st.hingeAdj=+e.target.value;LS.set('dr.settings',st);clearTimeout(hT);hT=setTimeout(()=>relayout(true),60)});
    $('#hingeReset').onclick=()=>{st.hingeAdj=0;LS.set('dr.settings',st);relayout(true);renderSettings()}}
  const bedSet=()=>{LS.set('dr.settings',st);applyBed()};
  $('#bedStart')&&$('#bedStart').addEventListener('change',e=>{st.bedStart=e.target.value||'21:30';bedSet()});
  $('#bedEnd')&&$('#bedEnd').addEventListener('change',e=>{st.bedEnd=e.target.value||'06:30';bedSet()});
  $('#warm').addEventListener('input',e=>{st.warm=+e.target.value;$('#night').style.transition='none';bedSet();setTimeout(()=>$('#night').style.transition='',50)});
  $('#dim').addEventListener('input',e=>{st.dim=+e.target.value;$('#night').style.transition='none';bedSet();setTimeout(()=>$('#night').style.transition='',50)});
}
function applySettings(re=true){
  const st=S.set;
  reader.style.setProperty('--fs',st.size+'px');reader.style.setProperty('--lh',st.lh);reader.style.setProperty('--margin',st.margin+'px');
  document.documentElement.style.setProperty('--rfont',(FONTS.find(f=>f[0]===st.font)||FONTS[0])[2]);
  reader.classList.toggle('dropcaps',!!st.dropcaps);
  if(re)relayout(true);
}
function commit(re=true){LS.set('dr.settings',S.set);applySettings(false);if(re)relayout(true)}

applySettings(false);
const WELCOME=[
 ['Fold to close the book','Fold your Duo and the cover appears, like a closed hardcover. Tap it to keep reading.','<svg class="art" viewBox="0 0 240 150" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="80" y="10" width="80" height="130" rx="12"/><rect x="92" y="28" width="56" height="84" rx="4" fill="currentColor" opacity=".18" stroke="none"/><path d="M104 60h32M104 72h22" stroke-linecap="round"/></svg>'],
 ['Open for two pages','Unfold it and your book becomes a two-page spread, with the spine right on the hinge.','<svg class="art" viewBox="0 0 240 150" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M20 20c35-8 70-4 100 12 30-16 65-20 100-12v112c-35-8-70-4-100 12-30-16-65-20-100-12z"/><path d="M120 32v112"/><path d="M42 50h56M42 66h56M42 82h48M142 50h56M142 66h56M142 82h44" stroke-linecap="round" opacity=".55"/></svg>'],
 ['Make it yours','Hold a word to highlight or look it up. Write in the margins with Apple Pencil. Tap Aa for themes.','<svg class="art" viewBox="0 0 240 150" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="20" width="140" height="110" rx="10"/><path d="M50 50h100M50 70h70M50 90h90" opacity=".5"/><path d="M50 70h70" stroke-width="12" opacity=".25"/><path d="M168 120l6-22 40-40a8 8 0 0 1 11 11l-40 40z"/></svg>']];
function showWelcome(){
  let i=0;const w=$('#welcome');
  const draw=()=>{const [h,t,art]=WELCOME[i];w.innerHTML=`${art}<h2>${h}</h2><p>${t}</p><div class="dots">${WELCOME.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="btn" id="wNext">${i<WELCOME.length-1?'Next':'Start Reading'}</button>${i<WELCOME.length-1?'<button class="skip" id="wSkip">Skip</button>':''}`;
    $('#wNext').onclick=()=>{haptic();if(i<WELCOME.length-1){i++;draw()}else done()};$('#wSkip')&&($('#wSkip').onclick=done);$('#wNext').focus({preventScroll:true})};
  const done=()=>{LS.set('dr.welcomed',1);w.animate([{opacity:1},{opacity:0}],{duration:250}).finished.then(()=>{w.hidden=true});};
  w.hidden=false;draw();
}
loadLibrary().then(()=>{
  const sp=$('#splash');requestAnimationFrame(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500)});
  if(!LS.get('dr.welcomed',0))showWelcome();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
